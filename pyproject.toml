[project]
name = "finetuning-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Winkler", email = "christian.winkler@datanizing.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bitsandbytes>=0.50.2",
    "causal-conv1d>=1.7.0",
    "einops>=0.8.2",
    "flash-linear-attention>=0.5.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "kernels>=0.17.2",
    "liger-kernel[cutedsl]>=0.8.4",
    "matplotlib>=3.11.2",
    "openai>=3.33.0",
    "pandas==3.0.0",
    "peft>=0.21.2",
    "pip>=26.2.1",
    "sentence-transformers[image]>=6.1.0",
    "spacy>=3.8.16",
    "tantivy>=0.26.2",
    "tqdm>=4.70.1",
    "transformers>=5.20.1",
    "trl>=1.16.0",
    "usearch==2.26.4",
]

[project.scripts]
finetuning-env = "finetuning_env:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
